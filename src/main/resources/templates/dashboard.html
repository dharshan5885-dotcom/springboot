<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Service Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Smart Service Management</a>
        <a class="btn btn-primary" href="/requests/new">+ New Request</a>
    </div>
</nav>

<div class="container py-4">
    <h2 class="mb-4">Admin Dashboard</h2>

    <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="card shadow-sm"><div class="card-body"><h6>Total</h6><h2 th:text="${total}">0</h2></div></div></div>
        <div class="col-md-3"><div class="card shadow-sm"><div class="card-body"><h6>Pending</h6><h2 th:text="${pending}">0</h2></div></div></div>
        <div class="col-md-3"><div class="card shadow-sm"><div class="card-body"><h6>In Progress</h6><h2 th:text="${inProgress}">0</h2></div></div></div>
        <div class="col-md-3"><div class="card shadow-sm"><div class="card-body"><h6>Resolved</h6><h2 th:text="${resolved}">0</h2></div></div></div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Recent Requests</h5>
                <a href="/requests" class="btn btn-outline-dark btn-sm">View All</a>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${requests}">
                        <td th:text="${r.id}"></td>
                        <td th:text="${r.title}"></td>
                        <td th:text="${r.category}"></td>
                        <td th:text="${r.priority}"></td>
                        <td><span class="badge bg-secondary" th:text="${r.status}"></span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(requests)}"><td colspan="5" class="text-center">No requests yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
