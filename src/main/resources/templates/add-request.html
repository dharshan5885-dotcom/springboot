<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width:850px;">
        <div class="card-body p-4">
            <h2 class="mb-4">Create Service Request</h2>
            <form th:action="@{/requests/save}" th:object="${request}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Customer Name</label>
                        <input class="form-control" th:field="*{customerName}">
                        <div class="text-danger" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Customer Email</label>
                        <input class="form-control" type="email" th:field="*{customerEmail}">
                        <div class="text-danger" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></div>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Request Title</label>
                        <input class="form-control" th:field="*{title}">
                        <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Category</label>
                        <select class="form-select" th:field="*{category}">
                            <option value="">Select</option><option value="Internet">Internet</option><option value="Maintenance">Maintenance</option><option value="Plumbing">Plumbing</option><option value="Electrical">Electrical</option><option value="Other">Other</option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Priority</label>
                        <select class="form-select" th:field="*{priority}">
                            <option value="">Select</option><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Resolved">Resolved</option><option value="Rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
                        <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary">Save Request</button>
                        <a href="/requests" class="btn btn-secondary">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
