<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Smart Service Management</a>
        <a class="btn btn-primary" href="/requests/new">+ New Request</a>
    </div>
</nav>
<div class="container py-4">
    <div class="d-flex justify-content-between mb-3">
        <h2>Service Requests</h2>
        <a href="/" class="btn btn-outline-secondary">Dashboard</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-dark">
                <tr><th>ID</th><th>Customer</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${requests}">
                    <td th:text="${r.id}"></td>
                    <td><span th:text="${r.customerName}"></span><br><small th:text="${r.customerEmail}"></small></td>
                    <td th:text="${r.title}"></td>
                    <td th:text="${r.category}"></td>
                    <td th:text="${r.priority}"></td>
                    <td th:text="${r.status}"></td>
                    <td>
                        <a class="btn btn-sm btn-warning" th:href="@{/requests/edit/{id}(id=${r.id})}">Edit</a>
                        <a class="btn btn-sm btn-danger" th:href="@{/requests/delete/{id}(id=${r.id})}"
                           onclick="return confirm('Delete this request?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}"><td colspan="7" class="text-center">No requests found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
